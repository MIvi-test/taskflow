global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: fastapi
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - fastapi
        type: A
        port: 8000

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100