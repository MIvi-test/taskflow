services:
  fastapi:
    build:
      context: .
      target: production  
    container_name: fastapi
    environment:
      - PYTHONUNBUFFERED=1
    expose:
      - "8000" 
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.11.4-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      fastapi:
        condition: service_healthy
    restart: unless-stopped

volumes:
  frontend_dist:
  caddy_data:
  caddy_config: